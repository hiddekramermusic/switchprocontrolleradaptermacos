# procon_mapper configuration
#
# Buttons:  a b x y l r zl zr plus minus home capture lstick rstick up down left right
# Actions:  key <name>            e.g. key space, key cmd+tab, key ctrl+shift+left
#           mouse left|right|middle
#           none
# Modifiers: cmd shift ctrl option (alt)
# Keys:     a-z 0-9 space return tab escape delete forwarddelete up down left right
#           home end pageup pagedown f1-f12 minus equal leftbracket rightbracket
#           semicolon quote comma period slash backslash grave shift ctrl option cmd
#
# Sticks:   left_stick / right_stick = mouse | scroll | wasd | arrows | none
#           | keys <up> <left> <down> <right>   e.g. keys i j k l
#           Key modes press one key for straight directions, two for diagonals.
#           stick_key_threshold = deflection (0.1-0.95) at which keys are pressed

a       = mouse left
b       = mouse right
x       = key space
y       = key escape
zr      = mouse left
zl      = mouse middle
l       = key ctrl+left
r       = key ctrl+right
plus    = key return
minus   = key tab
home    = key cmd+tab
capture = none
lstick  = none
rstick  = none
up      = key up
down    = key down
left    = key left
right   = key right

left_stick   = wasd
right_stick  = mouse
mouse_speed  = 1200   # pixels per second at full deflection
scroll_speed = 800    # pixels per second at full deflection; negative inverts
deadzone     = 0.15   # fraction of full deflection
