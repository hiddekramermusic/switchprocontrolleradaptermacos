# procon_mapper gaming configuration
# Run with: ./procon_mapper procon_mapper_gaming.conf
#
# Left stick moves with WASD, right stick moves the mouse (camera).
# Face buttons, shoulders, D-pad, Plus/Minus and stick clicks follow the keyboard
# layout listed for the Ryujinx Switch emulator: A=Z B=X X=C Y=V, L=E R=U ZL=Q ZR=O,
# D-pad = arrows, left stick click = F, right stick click = H.
# See procon_mapper.conf for all control, key and stick options.

a       = key z
b       = key x
x       = key c
y       = key v
l       = key e
r       = key u
zl      = key q
zr      = key o
plus    = key equal
minus   = key minus
home    = key return   # GameCube Start (Dolphin default: Return)
capture = none
lstick  = key f
rstick  = key h
up      = key up
down    = key down
left    = key left
right   = key right

left_stick          = wasd   # or: arrows, keys <up> <left> <down> <right>
right_stick         = mouse
stick_key_threshold = 0.5
mouse_speed         = 1200
mouse_mode          = relative   # leave the cursor to the game; send movement only
scroll_speed        = 800
deadzone            = 0.15
